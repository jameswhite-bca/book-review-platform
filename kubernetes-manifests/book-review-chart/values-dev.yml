# Dev Environment Settings
api:
  replicaCount: 1
  env:
    nodeEnv: "development"
  db:
    configMapName: "dev-api-config"
    secretName: "dev-book-review-secrets"
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "200m"

ui:
  replicaCount: 1
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "100m"

ingress:
  host: "dev.localhost"

postgres:
  persistence:
    size: "2Gi"
  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "250m"

secrets:
  name: "dev-book-review-secrets"
  postgresPassword: "dev-postgres-pass"
  dbPassword: "dev-postgres-pass"
  jwtSecret: "dev-jwt-secret-key-12345"