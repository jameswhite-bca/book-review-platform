# NOTE: Placeholders for development.
# For production, utilize Azure Key Vault + External Secrets Operator or pass via pipeline values.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.name | default "book-review-secrets" }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: book-review
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  DB_PASSWORD: {{ .Values.secrets.dbPassword | quote }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}