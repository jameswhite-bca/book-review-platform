apiVersion: apps/v1
kind: Deployment
metadata:
  name: book-api  # Kept static and clean, just like your base file!
  namespace: {{ .Release.Namespace }}
  labels:
    app: book-api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app: book-api
  template:
    metadata:
      labels:
        app: book-api
    spec:
      containers:
      - name: book-api
        image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag | default .Chart.AppVersion }}"
        ports:
        - containerPort: {{ .Values.api.port }}
          name: http
        env:
        - name: NODE_ENV
          value: {{ .Values.api.env.nodeEnv | quote }}
        - name: PORT
          value: {{ .Values.api.port | quote }}
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: {{ .Values.api.db.configMapName }}
              key: DB_HOST
        - name: DB_PORT
          value: {{ .Values.api.db.port | quote }}
        - name: DB_NAME
          value: {{ .Values.api.db.name | quote }}
        - name: DB_USER
          value: {{ .Values.api.db.user | quote }}
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.api.db.secretName }}
              key: DB_PASSWORD
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ .Values.api.db.secretName }}
              key: JWT_SECRET
        resources:
          {{- toYaml .Values.api.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /health
            port: {{ .Values.api.port }}
          initialDelaySeconds: {{ .Values.api.probes.liveness.initialDelaySeconds }}
          periodSeconds: {{ .Values.api.probes.liveness.periodSeconds }}
        readinessProbe:
          httpGet:
            path: /health
            port: {{ .Values.api.port }}
          initialDelaySeconds: {{ .Values.api.probes.readiness.initialDelaySeconds }}
          periodSeconds: {{ .Values.api.probes.readiness.periodSeconds }}