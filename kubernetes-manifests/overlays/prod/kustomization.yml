apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namePrefix: prod-
namespace: book-review-prod

labels:
  - includeSelectors: true
    pairs:
      environment: prod

images:
  - name: jameswhite83/book-ui  # <--- This must match your base deployment exactly
    newTag: v1.3.0

patches:
  - path: ingress-patch.yml
    target:
      kind: Ingress
      name: book-review-ingress
      namespace: book-review-platform

configMapGenerator:
  - name: api-config
    literals:
      - DB_HOST=prod-postgres