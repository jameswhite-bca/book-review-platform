apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namePrefix: prod-
namespace: book-review-prod

labels:
  - includeSelectors: true
    pairs:
      environment: prod

patches:
  - path: ingress-patch.yml
    target:
      kind: Ingress
      name: book-review-ingress
      namespace: book-review-platform